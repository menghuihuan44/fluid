# Gradle settings for the Fluid Android shell.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# The shell deliberately uses no AndroidX / Jetpack libraries: it only needs the
# framework Activity, Service, MediaProjection, ImageReader and SurfaceView APIs.
android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official
